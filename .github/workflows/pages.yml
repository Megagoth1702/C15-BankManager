name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publish the Vite production build (dist/) to the gh-pages branch.
# Repo Settings → Pages → Source: Deploy from a branch → gh-pages → / (root)
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: |
          node -v
          npm -v
          # Prefer lockfile install; fall back with full log if CI npm policy differs.
          npm ci --no-fund --no-audit || {
            echo 'npm ci failed; retrying with npm install'
            npm install --no-fund --no-audit
          }

      - name: Build
        run: npm run build

      - name: Verify production index (not Vite dev entry)
        run: |
          test -f dist/index.html
          grep -q '/assets/' dist/index.html
          if grep -q 'main.ts' dist/index.html; then
            echo 'ERROR: dist/index.html still references main.ts (dev entry)'
            cat dist/index.html
            exit 1
          fi
          echo 'OK: production index'
          cat dist/index.html

      - name: Deploy dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
